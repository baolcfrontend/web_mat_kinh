<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/client/public/assets/css/block.css">
    <link rel="stylesheet" href="/client/public/assets/css/layout.css">
    <style>
        /* Tổng thể trang */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fc;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Thanh header */
        header {
            background-color: #00accf;
            color: white;
            padding: 20px 0;
            text-align: center;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Phần nội dung */
        .content {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 30px;
        }

        /* Nút Thêm Sản Phẩm */
        .btn {
            background-color: #00accf;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            text-decoration: none;
            display: inline-block;

        }

        .btn a {
            text-decoration: none;
            color: white;
        }

        .btn:hover {
            background-color: #0704d1;
            transform: translateY(-2px);
        }

        /* Nút Thêm Sản phẩm: Nổi bật */
        .btn-add {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        .btn-add:hover {
            background-color: #0069d9;
        }

        /* Nút Sửa và Xóa */
        .btn-edit {
            background-color: #ffc107;
            margin-right: 10px;
            transition: background-color 0.3s;
        }

        .btn-edit:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #dc3545;
            transition: background-color 0.3s;
        }

        .btn-danger:hover {
            background-color: #c82333;
            transform: translateY(-2px);
        }

        /* Bảng */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 1rem;
        }

        th {
            background-color: #f1f1f1;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #f9f9f9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Hình ảnh sản phẩm */
        td img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }

        /* Responsive: làm cho bảng hiển thị đẹp trên thiết bị di động */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }

            .content {
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

            .btn {
                font-size: 0.9rem;
                padding: 8px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .btn-add {
                font-size: 0.9rem;
                padding: 10px 20px;
            }

            td img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Quản lý</h1>
                <a href="/client/view/layout_admin/admin.html"><img style="filter: brightness(500%);"
                        src="/client/public/img/Sunny.png" alt="Logo" width="100px 100px"></a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/client/view/layout_admin/admin.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                <li><a href="/client/view/layout_admin/admin_user.html"><i class="fa-solid fa-user"></i> Người dùng</a></li>
                <li><a href="/client/view/layout_admin/admin_category.html"><i class="fa-solid fa-list"></i> Danh mục</a></li>
                <li><a href="/client/view/layout_admin/admin_product.html"><i class="fa-brands fa-product-hunt"></i> Sản
                        phẩm</a></li>
                <li><a href="/client/view/layout_admin/admin_cart.html"><i class="fa-solid fa-truck-fast"></i> Đơn hàng</a>
                </li>
                <li><a href="/client/view/layout_admin/admin_blog.html"><i class="fa-solid fa-blog"></i> Bài viết</a></li>
                <li><a href="/client/view/layout_admin/admin_comment.html"><i class="fa-solid fa-comment"></i> Đánh giá</a>
                </li>
                <li><a href="/client/index.html"><i class="fa-solid fa-rotate-left"></i> Quay về trang web</a></li>
            </ul>
        </div>
        <!-- Main Content -->
        <div class="main-content" id="body">

            <header>
                <h1>Quản lý Danh mục</h1>
            </header>
            <div class="content">
                <button class="btn"><a href="/client/view/layout_admin/admin_categoryadd.html">Thêm Danh Mục</a></button>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Danh mục</th>
                            <th>Số Sản Phẩm</th>
                            <th>Ảnh</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Gọng Kính</td>
                            <td>10</td>
                            <td><img src="/client/public/img/ghi-3.jpeg" alt="Gọng Kính"></td>
                            <td>
                                <button class="btn btn-edit">
                                    <a href="/client/view/layout_admin/admin_categoryupdate.html">Sửa</a>
                                </button>
                                <a data-id="${category.id}" class="btn btn-danger" data-name="${category.name}">Xóa</a>
                            </td>
                        </tr>
                      <tr>
                            <td>2</td>
                            <td>Tròng Kính</td>
                            <td>7</td>
                            <td><img src="/client/public/img/trong1.jpeg" alt="Gọng Kính"></td>
                            <td>
                                <button class="btn btn-edit">
                                    <a href="/client/view/layout_admin/admin_categoryupdate.html">Sửa</a>
                                </button>
                                <a data-id="${category.id}" class="btn btn-danger" data-name="${category.name}">Xóa</a>
                            </td>
                        </tr>
                     


                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
