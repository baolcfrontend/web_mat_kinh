<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Đăng Ký</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 1000px;
            overflow: hidden;
        }

        .auth-container img {
            width: 300px;
            height: auto;
            object-fit: cover;
            border-radius: 10px;
        }

        .form-container {
            margin-left: 30px;
            flex: 1;
        }

        .form-container h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-container input:focus {
            border-color: #45c0b5;
        }

        .form-container button {
            width: 100%;
            padding: 12px;
            background-color: #45c0b5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #009688;
        }

        .form-container .remember-me {
            margin: 10px 0;
        }

        .form-container .forgot-password {
            color: #45c0b5;
            font-size: 14px;
            text-align: right;
            text-decoration: none;
        }

        .form-container .forgot-password:hover {
            text-decoration: underline;
        }

        .form-container .google-login {
            background-color: white;
            border: 1px solid #ddd;
            color: #333;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 12px;
            border-radius: 5px;
        }

        .form-container .google-login i {
            margin-right: 10px;
        }

        .form-container .register-link {
            font-size: 14px;
            text-align: center;
        }

        .form-container .register-link a {
            color: #45c0b5;
            text-decoration: none;
        }

        .form-container .register-link a:hover {
            text-decoration: underline;
        }

        .toggle-btns {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .toggle-btns button {
            background-color: transparent;
            border: none;
            font-size: 16px;
            color: #45c0b5;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-btns button.active {
            color: #009688;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <!-- Image on the left side -->
        <img src="https://via.placeholder.com/300x400" alt="Image Description">

        <!-- Form on the right side -->
        <div class="form-container">
            <div class="toggle-btns">
                <button id="loginBtn" class="active">Đăng Nhập</button>
                <button id="registerBtn">Đăng Ký</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <h2>Đăng nhập</h2>
                <form>
                    <input type="text" placeholder="Tài Khoản" required>
                    <input type="password" placeholder="Mật Khẩu" required>
                    <div class="remember-me">
                        <input type="checkbox"> Lưu tài khoản
                    </div>
                    <button type="submit">Đăng nhập</button>
                </form>
                <a href="#" class="forgot-password">Quên mật khẩu?</a>
                <div class="google-login">
                    <i class="fab fa-google"></i> Đăng nhập bằng Google
                </div>
                <div class="register-link">
                    <p>Bạn chưa có tài khoản? <a href="#" id="goToRegister">Đăng ký ngay</a></p>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <h2>Đăng ký</h2>
                <form>
                    <input type="text" placeholder="Họ và tên" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Mật khẩu" required>
                    <input type="password" placeholder="Xác nhận mật khẩu" required>
                    <button type="submit">Đăng ký</button>
                </form>
                <div class="google-login">
                    <i class="fab fa-google"></i> Đăng ký bằng Google
                </div>
                <div class="register-link">
                    <p>Bạn đã có tài khoản? <a href="#" id="goToLogin">Đăng nhập ngay</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle between login and register forms
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const goToRegister = document.getElementById('goToRegister');
        const goToLogin = document.getElementById('goToLogin');

        loginBtn.addEventListener('click', () => {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            loginBtn.classList.add('active');
            registerBtn.classList.remove('active');
        });

        registerBtn.addEventListener('click', () => {
            registerForm.style.display = 'block';
            loginForm.style.display = 'none';
            registerBtn.classList.add('active');
            loginBtn.classList.remove('active');
        });

        goToRegister.addEventListener('click', () => {
            registerForm.style.display = 'block';
            loginForm.style.display = 'none';
            registerBtn.classList.add('active');
            loginBtn.classList.remove('active');
        });

        goToLogin.addEventListener('click', () => {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            loginBtn.classList.add('active');
            registerBtn.classList.remove('active');
        });
    </script>
</body>

</html>
