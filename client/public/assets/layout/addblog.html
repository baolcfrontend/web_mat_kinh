<!DOCTYPE html>
<html lang="vi">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/views/assets/css/block.css">
    <link rel="stylesheet" href="/admin/views/assets/css/add_blog.css">

</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Quản lý</h1>
                <a href=""><img style="filter: brightness(500%);"
                        src="/public/upload/imgs/Banner_Logo/2handstore/auraglam.png" alt="Logo"
                        width="150px 150px"></a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/trangchu.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                <li><a href="user.html"><i class="fa-solid fa-user"></i> Người dùng</a></li>
                <li><a href="/danhmuc.html"><i class="fa-solid fa-list"></i> Danh mục</a></li>
                <li><a href="/sanpham.html"><i class="fa-brands fa-product-hunt"></i> Sản phẩm</a></li>
                <li><a href="./"><i class="fa-solid fa-truck-fast"></i> Đơn hàng</a></li>
                <li><a href="./"><i class="fa-solid fa-ticket"></i> Voucher</a></li>
                <li><a href="blog.html"><i class="fa-solid fa-blog"></i> Bài viết</a></li>
                <li><a href="danhgia.html"><i class="fa-solid fa-comment"></i> Đánh giá</a></li>
                <li><a href="#"><i class="fa-solid fa-rotate-left"></i> Quay về trang web</a></li>
            </ul>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <div class="form-container">
                <h2>Thêm mới bài viết</h2>
                <form action="add_post.php" method="POST" enctype="multipart/form-data">
                    <!-- Post Title -->
                    <div class="form-group">
                        <label for="postTitle">Tiêu đề bài viết</label>
                        <input type="text" id="postTitle" name="postTitle" required>
                    </div>

                    <!-- Post Content -->
                    <div class="form-group">
                        <label for="postContent">Nội dung bài viết</label>
                        <textarea id="postContent" name="postContent" required></textarea>
                    </div>

                    <!-- Post Category -->
                    <div class="form-group">
                        <label for="category">Danh mục bài viết</label>
                        <select id="category" name="category" required>
                            <option value="news">Tin tức</option>
                            <option value="tutorial">Hướng dẫn</option>
                            <option value="promotion">Khuyến mãi</option>
                            <!-- Add more categories as needed -->
                        </select>
                    </div>

                    <!-- Post Image -->
                    <div class="form-group">
                        <label for="postImage">Ảnh bài viết</label>
                        <input type="file" id="postImage" name="postImage" accept="image/*">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn">Thêm mới</button>
                    <button type="reset" class="btn btn-danger">Hủy</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
